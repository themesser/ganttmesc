<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning global • Éditeur Gantt</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--page);color-scheme:light;--ink:#162335;--page:#f4f6f9;--chart-text:#37485a;--chart-month:#cfd6dc;--chart-section:#c3ccd4;--chart-row:#e3e6ea;--chart-active:#bac7d6;--day:#f2f5f8;--day-text:#304660;--off:var(--day);--row-add:#e3edf8;--marker:#b92e36;--button-hover:#eff5fa;--input-border:#b9c8d7;--danger:#9c1322;--chart-highlight:#184d8225;--chart-selection:#193b66;--chart-edge:#ffffff75;--buffer-opacity:.28;--day-on-bar:#111;--day-outline:#ffffffdb;--muted:#506177;--border:#dce3eb;--accent:#184d82;--panel:#fff}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{min-height:38px;padding:7px 13px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:inherit;cursor:pointer;font-weight:600}
button:hover{background:var(--button-hover);border-color:#a9bfd3}
button:disabled{opacity:.48;cursor:default}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.primary:hover{background:#123d68}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2678bd;outline-offset:2px}
[hidden]{display:none!important}
main{max-width:1460px;margin:auto;padding:clamp(14px,4vw,48px)}
header{margin-bottom:20px}
.heading,.actions,.dialog-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:clamp(1.6rem,3.2vw,2.45rem);letter-spacing:-.045em;margin:0 5px 0 0;overflow-wrap:anywhere}
.heading button{font-size:.8rem;min-height:32px;padding:4px 9px}
.period{margin:4px 0 16px;color:var(--muted);font-size:.91rem}
.actions{justify-content:space-between}
.actions > div{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#status:empty{display:none}
#status{font-size:.83rem;color:var(--muted);margin:9px 0 0;min-height:1.2em}
.board{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px #182d4610;overflow:hidden}
.chart{overflow:auto;padding:8px 10px;position:relative}
.chart svg{display:block;margin:0 auto}
.chart svg [data-hit]{cursor:pointer}
.chart svg [data-hit^="item:"]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chart.is-dragging,.chart.is-dragging svg [data-hit]{cursor:grabbing}
.chart svg [data-edge]{cursor:ew-resize;fill:transparent;touch-action:none}
.chart svg [data-hit]:hover [data-edge]{fill:var(--chart-edge);stroke:var(--ink);stroke-width:.45}
.zoom-controls{display:flex;align-items:center;gap:5px}
.zoom-controls output{min-width:50px;text-align:center;font-size:.85rem;color:var(--muted)}
.chart.is-dragging svg [data-edge]{cursor:ew-resize}
.chart svg .row-plus{opacity:0}
.chart svg .row-heading:hover .row-plus,.chart svg .row-heading:focus-within .row-plus,.chart svg .row-plus:focus-visible,.chart svg .empty-plus{opacity:1}
.chart svg .line-title{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chart svg .line-title.drop-target > .target{fill:var(--chart-highlight);stroke:var(--chart-selection);stroke-width:1}
.chart svg .root-title:hover .indent-target,.chart svg .indent-target{fill:#dbeafe}
@media(hover:none){.chart svg .row-plus{opacity:1}}
.chart svg .buffer-handle{cursor:ew-resize;touch-action:none}
.chart svg [data-hit]:hover .buffer-handle{stroke:#52687c;stroke-width:1;stroke-dasharray:2 2}
label.buffer-toggle{display:flex;align-items:center;gap:8px}
.buffer-toggle input{width:auto;min-height:0;margin:0}
.heading #title{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.heading #title:hover{text-decoration:underline}
.chart svg .selected-item{filter:drop-shadow(0 0 2px #0965bc)}
.chart svg .selected-item .shape{stroke:var(--chart-selection);stroke-width:1.4}
.chart svg [data-day]:hover > .day-highlight{stroke:var(--chart-selection);stroke-width:1}
.chart svg .selection-box{fill:var(--chart-highlight);stroke:var(--chart-selection);stroke-width:1;pointer-events:none}
.chart svg .drag-source{opacity:.22}
.chart svg .drag-preview{pointer-events:none;opacity:.86}
.drag-dates{position:fixed;z-index:5;pointer-events:none;padding:6px 9px;border-radius:6px;background:#162335;color:#fff;font-size:.8rem;max-width:min(290px,calc(100vw - 16px));box-shadow:0 2px 9px #182d4630}
.chart svg [data-hit]:hover .shape,.chart svg [data-hit]:focus-visible .shape{filter:brightness(.84)}
.chart svg [data-hit]:hover .label,.chart svg [data-hit]:focus-visible .label{text-decoration:underline}
.chart svg [data-hit]:hover .target{fill:var(--chart-highlight)}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 20px}
.toolbar .actions{margin-left:auto}
.toolbar h1{flex:1 1 220px}
.fields small{font-weight:400;color:var(--muted)}
.help-list{grid-column:1/-1;margin:0;padding-left:20px}
.help-list li+li{margin-top:8px}
.chart svg .buffer-editing > .buffer-line{opacity:.15}
.chart svg .buffer-band{fill-opacity:var(--buffer-opacity)}
.chart svg .buffer-line,.chart svg .day-number{pointer-events:none}
@media screen and (prefers-color-scheme:dark){
  :root{color-scheme:dark;--ink:#edf2f8;--page:#090a0c;--panel:#111316;--muted:#b1bed0;--border:#343b46;--accent:#275e94;--chart-text:#d1dce9;--chart-month:#404a58;--chart-section:#566171;--chart-row:#303844;--chart-active:#465363;--day:#232a33;--day-text:#e0e9f3;--off:var(--day);--row-add:#293d55;--marker:#ff8189;--button-hover:#212b37;--input-border:#515f71;--danger:#ff9da5;--chart-highlight:#83baff32;--chart-selection:#9bd0ff;--chart-edge:#cde4ff91;--buffer-opacity:.38}
  .chart svg .lot-label{fill:color-mix(in srgb, var(--lot-color) 62%, white 38%)}
  .chart svg [data-hit]:hover .shape,.chart svg [data-hit]:focus-visible .shape{filter:brightness(1.18)}
  dialog::backdrop{background:#000a}
}

dialog{width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 30px);padding:0;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 60px #0b233950;color:inherit;background:var(--panel)}
dialog::backdrop{background:#162b4565}
form{padding:21px}
h2{margin:0 0 16px;font-size:1.24rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0 0 18px}
label{display:grid;gap:5px;font-size:.84rem;font-weight:650;min-width:0}
label.wide{grid-column:1/-1}
input,select{width:100%;min-height:39px;padding:6px 8px;border:1px solid var(--input-border);border-radius:7px;color:inherit;background:var(--panel)}
input[type=color]{width:65px;padding:4px}
.dialog-actions button:last-child{margin-left:auto}
#error{color:var(--danger);font-size:.85rem;margin:0 0 12px}
@media(max-width:500px){.actions{align-items:flex-start;gap:10px}.chart{padding:4px}.fields{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:10mm}body{background:white}main{max-width:none;padding:0}header{margin-bottom:6px}.actions,#status,dialog{display:none!important}.board{border:0;box-shadow:none}.chart{overflow:visible;padding:0}.chart svg{width:100%;height:auto;max-height:155mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<main>
  <header>
    <div class="toolbar heading"><h1><button id="title" type="button" aria-label="Renommer le planning" data-i18n-label="Rename the schedule"></button></h1>
    <div class="actions">
      <div><div class="zoom-controls" role="group" aria-label="Zoom horizontal" data-i18n-label="Horizontal zoom">
        <button id="zoom-out" type="button" aria-label="Réduire le zoom horizontal" data-i18n-label="Zoom out horizontally">−</button>
        <output id="zoom-level" aria-live="polite">100 %</output>
        <button id="zoom-in" type="button" aria-label="Augmenter le zoom horizontal" data-i18n-label="Zoom in horizontally">+</button>
      </div><button id="start-date" type="button" data-i18n="Settings">Paramétrage</button><button id="export" type="button">Load/Save</button><button id="help" type="button" data-i18n="Help">Aide</button><input id="load-json" type="file" accept=".json,application/json" hidden></div>
    </div>
    </div>
    <p class="period" id="period"></p>
    <p id="status" role="status"></p>
  </header>
  <section class="board" aria-label="Planning Gantt" data-i18n-label="Gantt schedule">
    <div class="chart" id="chart" tabindex="0" aria-label="Calendrier du planning" data-i18n-label="Schedule calendar"></div>

  </section>
</main>
<div class="drag-dates" id="drag-dates" aria-hidden="true" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <form id="form">
    <h2 id="dialog-title"></h2>
    <div class="fields" id="fields"></div>
    <p id="error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button class="danger" id="delete" type="button" hidden data-i18n="Delete">Supprimer</button>
      <button id="cancel" type="button" data-i18n="Close">Fermer</button>
      <button class="primary" id="save" type="submit" data-i18n="Save">Enregistrer</button>
    </div>
  </form>
</dialog>

function calendarFor(items) {
  const ranges = items.filter(item=>item.kind==='off')
    .map(item=>[dayNumber(item.start),dayNumber(item.end)]).sort((a,b)=>a[0]-b[0]);
  const holidays = [];
  for (const range of ranges) {
    const previous = holidays.at(-1);
    if (previous && range[0]<=previous[1]+1) previous[1] = Math.max(previous[1],range[1]);
    else holidays.push(range);
  }
  return holidays;
}
function weekdays(start,end) {
  if (end<start) return 0;
  const length = end-start+1;
  let total = Math.floor(length/7)*5;
  for (let i=0;i<length%7;i++) {
    const weekDay = new Date((start+i)*DAY).getUTCDay();
    if (weekDay>0 && weekDay<6) total++;
  }
  return total;
}
function workingDays(start,end,calendar) {
  return weekdays(start,end)-calendar.reduce((removed,[from,to])=>
    removed+weekdays(Math.max(start,from),Math.min(end,to)),0);
}
function timelineAxis(start,end,calendar,hideWeekends,hideHolidays) {
  const compressed = Boolean(hideWeekends || hideHolidays);
  const count = (from,to)=>{
    if (to<from) return 0;
    const total = hideWeekends?weekdays(from,to):to-from+1;
    if (!hideHolidays) return total;
    if (hideWeekends) return workingDays(from,to,calendar);
    return total-calendar.reduce((removed,[a,b])=>
      removed+Math.max(0,Math.min(to,b)-Math.max(from,a)+1),0);
  };
  const days = [];
  const columns = new Map();
  for (let day=start;day<=end;day++) {
    columns.set(day,days.length);
    if (count(day,day)) days.push(day);
  }
  const column = day=>columns.get(day)??(day>=start?count(start,day-1):-count(day,start-1));
  const dayAt = index=>{
    if (index<0) return days[0]??start;
    if (index<days.length) return days[index];
    if (!compressed) return Math.min(lastSupportedDay,start+index);
    let low = end+1;
    let high = lastSupportedDay;
    while (low<high) {
      const middle = Math.floor((low+high)/2);
      if (column(middle+1)>index) high=middle;
      else low=middle+1;
    }
    return Math.min(lastSupportedDay,low);
  };
  return {compressed,days,count,column,dayAt};
}
function advanceWorkingDays(start,count,calendar) {
  if (!count) return start-1;
  let low = start;
  let high = lastSupportedDay;
  while (low<high) {
    const middle = Math.floor((low+high)/2);
    if (workingDays(start,middle,calendar)>=count) high=middle;
    else low=middle+1;
  }
  return low;
}
function bufferLabel(days) {
  return days+(days===1?t(' jour ouvré'," working day"):t(' jours ouvrés'," working days"));
}
function bufferStartDay(item) {
  return item.kind==='review'?dayNumber(item.start):dayNumber(item.end)+1;
}
function bufferDaysFor(item) {
  return item.bufferDays||0;
}
function bufferEndDay(item,calendar) {
  return advanceWorkingDays(bufferStartDay(item),bufferDaysFor(item),calendar);
}
function bufferWidth(item,days) {

}

    const start = dayNumber(item.start);
    const days = item.bufferDays===0?0:workingDays(start,dayNumber(item.end)+(item.bufferDays||0),calendar);

function bufferLine(x,y,width,color) {

function addField(key,title,config={}) {
  const {value='',options,type='text',wide=false,required=true,limit=52} = config;
  const label = document.createElement('label');
  label.classList.toggle('wide',wide);
  label.append(title);
  const input = document.createElement(options?'select':'input');
  input.name = key;
  input.id = 'field-'+key;
  input.required = required;
  if (options) setOptions(input,options,value);
  else {
    input.type = type;
    if (type==='text') input.maxLength = limit;
    if (type!=='checkbox') input.value = value;
  }
  if (type==='checkbox') {
    label.classList.add('buffer-toggle');
    input.checked = Boolean(value);
    label.prepend(input);
  } else label.append(input);
  $('fields').append(label);
  return input;
}

function addRestrictionFields(value,mixed=false) {

    type:'checkbox',wide:true,required:false,value:Boolean(value)
  });
  const input = addField('restriction',t('Identifiant',"Resource ID"),{value:value||'',wide:true,required:false,limit:80});
  if (mixed) {
    toggle.indeterminate = true;
    input.placeholder = t('Plusieurs identifiants',"Multiple resource IDs");
  }
  const sync = ()=>{ input.disabled = !toggle.checked; };
  toggle.onchange = sync;
  sync();
  editor.restrictionToggle = toggle;
}
function error(message) {
  $('error').textContent = message;
  $('error').hidden = false;
}
function localToday() {

}
function formatHolidays(items,year) {
  function format(date) {
    const [y,m,d] = date.split('-');
    return Number(d)+'/'+Number(m)+(y===year?'':'/'+y);
  }
  return items.filter(item=>item.kind==='off').sort((a,b)=>a.start.localeCompare(b.start))
    .map(item=>format(item.start)+(item.start===item.end?'':'-'+format(item.end))).join('; ');
}
function readHolidays(text,year,existing) {
  function parse(text,fallbackYear) {
    const parts = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/.exec(text.trim());
    if (!parts) throw Error(t('Date invalide',"Invalid date"));
    const [_,day,month,explicitYear] = parts;
    const date = (explicitYear||fallbackYear)+'-'+month.padStart(2,'0')+'-'+day.padStart(2,'0');
    if (!validIso(date)) throw Error(t('Date invalide',"Invalid date"));
    return date;
  }
  return [...new Set(text.split(';').map(piece=>piece.trim()).filter(Boolean))].map(piece=>{
    const parts = piece.split(/[-–]/);
    if (parts.length>2) throw Error(t('Période invalide',"Invalid date range"));
    const start = parse(parts[0],year);
    let end = parts.length===2?parse(parts[1],start.slice(0,4)):start;
    if (end.slice(5,7)<start.slice(5,7) && end<start && parts[1].trim().split('/').length===2) end = parse(parts[1],String(Number(start.slice(0,4))+1));
    if (end<start) throw Error(t('Période invalide',"Invalid date range"));
    return existing.find(item=>item.kind==='off' && item.start===start && item.end===end)
      || {id:newId(),kind:'off',name:start===end?t('Jour chômé',"Non-working day"):t('Vacances',"Holidays"),start,end};
  });
}
function submit(event) {

  if (mode==='browse') {
    showEditor('item',planning.items.find(item=>item.id===form.item));
    return;
  }
  const name = form.name?.trim();
  if ($('field-name')?.required && !name) {
    error(t('Saisis un intitulé.',"Enter a name."));
    return;
  }
  const next = clone(planning);
  if (editor.restrictionToggle && !editor.restrictionToggle.indeterminate && form.hasRestriction && !form.restriction?.trim()) {
    error(t('Saisis le nom de l’identifiant.',"Enter a resource ID."));
    return;
  }
  const restriction = form.hasRestriction?form.restriction.trim().slice(0,80):'';
  if (mode==='bulk') {
    if (!editor.restrictionToggle.indeterminate) {
      for (const item of next.items.filter(item=>seed.ids.includes(item.id))) {
        if (restriction) item.restriction = restriction;
        else delete item.restriction;
      }
      commit(next);
    }
    $('dialog').close();
    return;
  }
  if (mode==='date' || mode==='blank') {
    if (!validIso(form.start)) {
      error(t('Saisis une date avec une année à quatre chiffres.',"Enter a date with a four-digit year."));
      return;
    }
    if (mode==='date' && (!validIso(form.end) || form.end<form.start)) {
      error(t('La fin estimée doit être égale ou postérieure au début.',"The estimated end date must be on or after the start date."));
      return;
    }
    if (mode==='date' && form.holidays!==undefined && form.holidays!==editor.holidaysText) {
      try {
        const ranges = readHolidays(form.holidays,form.start.slice(0,4),next.items);
        next.items = [...next.items.filter(item=>item.kind!=='off'),...ranges];
      } catch {
        error(t('Saisis les vacances sous la forme 20/02-7/03; 6/05; avec des dates valides.',"Enter valid holidays in day/month format, such as 20/02-7/03; 6/05;."));
        return;
      }
    }
    $('dialog').close();
    if (mode==='blank') {
      selectedItems.clear();
      commit({title:t('Nouveau planning',"New schedule"),startDate:form.start,lots:[],items:[]},{fitPeriod:true});
      $('chart').scrollLeft = 0;
    } else {
      next.startDate = form.start;
      next.endDate = form.end;
      for (const [key] of displayOptions) next[key] = Object.hasOwn(form,key);
      if (next.startDate!==planning.startDate || next.endDate!==planning.endDate
        || displayOptions.some(([key])=>next[key]!==Boolean(planning[key]))
        || (form.holidays!==undefined && form.holidays!==editor.holidaysText)) {
        commit(next);
        $('chart').scrollLeft = 0;
      }
    }
    return;
  }

  else if (kind==='lot') {
    if (mode==='add') next.lots.push({id:newId(),name,color:form.color,rows:[]});
    else Object.assign(next.lots.find(lot=>lot.id===seed.id),{name,color:form.color});
  } else if (kind==='row') {
    if (mode==='add') next.lots.find(lot=>lot.id===form.lot).rows.push({id:newId(),name});
    else {
      const lot = next.lots.find(lot=>lot.id===seed.lot);
      const row = lot.rows.find(row=>row.id===seed.id);
      row.name = name;
      if (lot.inline && row===lot.rows[0]) lot.name = name;
    }
  } else {
    const start = form.isDelivery?(form.end||form.start):form.start;
    const end = form.end || start;
    if (![start,end].every(validIso)) {
      error(t('Saisis une date avec une année à quatre chiffres.',"Enter a date with a four-digit year."));
      return;
    }
    if (dayNumber(end)<dayNumber(start)) {
      error(t('La date de fin doit être égale ou postérieure à la date de début.',"The end date must be on or after the start date."));
      return;
    }
    const finalKind = ['task','delivery'].includes(kind)?(form.isDelivery?'delivery':'task'):kind;
    const item = {id:seed.id||newId(),kind:finalKind,start,end};
    if (kind==='marker' && form.isDelivery) item.diamond = true;
    const lot = mode==='item' && rowTypes.has(kind)?seed.lot:form.lot;
    const row = mode==='item' && rowTypes.has(kind)?seed.row:form.row;
    if (lot) item.lot = lot;
    if (row) item.row = row;
    if (restriction && bufferTypes.has(kind)) item.restriction = restriction;
    if (name) item.name = name;
    if (form.caption?.trim()) item.caption = form.caption.trim();
    if (bufferTypes.has(kind)) {
      const days = form.hasBuffer?Number(form.bufferDays):0;
      const available = workingDays(bufferStartDay(item),lastSupportedDay,scale.calendar);
      if (!Number.isSafeInteger(days) || (form.hasBuffer && days<1) || days>available) {
        error(t('Saisis un nombre entier de jours positif compatible avec la date de fin.',"Enter a positive whole number of days that fits after the end date."));
        return;
      }
      setBuffer(item,days);
    }
    if (seed.anchor && seed.start===start) item.anchor = seed.anchor;
    if (mode==='add') next.items.push(item);

  }

  commit(next);
}
function remove() {
  const {mode,seed} = editor;
  const next = clone(planning);
  if (mode==='item') next.items = next.items.filter(item=>item.id!==seed.id);
  if (mode==='lot' || mode==='row') {
    const keep = item=>mode==='lot' ? item.lot!==seed.id : item.row!==seed.id;
    const remaining = next.items.filter(keep);
    const count = next.items.length-remaining.length;
    if (count && !editor.confirmDelete) {
      editor.confirmDelete = true;
      const suffix = count===1?'':'s';
      error(t(
        `Cette suppression retire aussi ${count} élément${suffix} du planning. Clique de nouveau sur Supprimer pour confirmer.`,
        `This also removes ${count} item${suffix} from the schedule. Click Delete again to confirm.`
      ));
      return;
    }
    next.items = remaining;
    if (mode==='lot') next.lots = next.lots.filter(lot=>lot.id!==seed.id);
    else {
      const lot = next.lots.find(lot=>lot.id===seed.lot);
      lot.rows = lot.rows.filter(row=>row.id!==seed.id);
    }
  }
  $('dialog').close();
  commit(next);
}

function handleHit(event) {

  if (!hit) return;

    if (event.key!=='Enter' && event.key!==' ') return;
    event.preventDefault();
  }

  const day = event.target.closest('[data-day]')?.dataset.day;
  if (day && (event.shiftKey || (kind==='day' && event.type==='keydown')) && event.type!=='dblclick') {
    if (event.detail>1) return;
    const next = clone(planning);
    const item = {id:newId(),kind:'marker',start:day,end:day};
    next.items.push(item);
    selectOnly(item.id);
    commit(next);
    $('chart').focus({preventScroll:true});
    return;
  }
  if (kind==='item') {
    const item = planning.items.find(item=>item.id===id);
    if (!selectedItems.has(id)) selectOnly(id);
    paintSelection();
    if (event.type!=='click' || event.detail===0) {
      const selected = planning.items.filter(item=>selectedItems.has(item.id) && bufferTypes.has(item.kind));
      if (selected.length>1) showEditor('bulk',{ids:selected.map(item=>item.id)});
      else showEditor('item',item);
    } else $('chart').focus({preventScroll:true});
    return;
  }
  if (event.type==='dblclick') return;
  selectedItems.clear();
  paintSelection();
  if (kind==='plus') insertLine(id,rowId,event.shiftKey);
  if (kind==='lot') showEditor('lot',{...planning.lots.find(lot=>lot.id===id),kind});
  if (kind==='row' || kind==='cell') {
    const lot = planning.lots.find(lot=>lot.rows.some(row=>row.id===id));
    if (kind==='row') showEditor('row',{...lot.rows.find(row=>row.id===id),kind,lot:lot.id});
    else {
      const svg = hit.ownerSVGElement;
      const {x} = chartPoint(svg,event.clientX,event.clientY);
      const day = dayAtPointer(x);
      if (day===undefined) return;
      const start = isoDay(day);
      if (event.detail>1) return;
      const next = clone(planning);
      const item = {id:newId(),kind:'task',lot:lot.id,row:id,start,end:start};

}
function dayAtPointer(x) {

}

  const chart = $('chart');
  const bounds = preview && save && chart.getBoundingClientRect();
  const inside = bounds && (finished.buffer || (event.clientX>=bounds.left && event.clientX<=bounds.right))
    && event.clientY>=bounds.top && event.clientY<=bounds.bottom;
  const target = inside ? dragDestination(chartPoint(svg,event.clientX,event.clientY)) : null;

  if (!preview) return;
  suppressClick = true;
  if (frame!=null) cancelAnimationFrame(frame);
  preview.remove();

  chart.classList.remove('is-dragging');
  if (chart.hasPointerCapture(pointerId)) chart.releasePointerCapture(pointerId);
  $('drag-dates').hidden = true;
  if (!target) return;
  if (finished.buffer) {
    if (target.bufferDays===bufferDaysFor(item)) return;
    const next = clone(planning);
    const marker = next.items.find(entry=>entry.id===item.id);
    setBuffer(marker,target.bufferDays);
    commit(next);
    return;
  }
  const previousEnd = item.kind==='review'
    ? isoDay(Math.max(dayNumber(item.start),bufferEndDay(item,scale.calendar))) : item.end;
  if (target.start===item.start && target.end===previousEnd
    && (!target.lane || target.lane.row.id===item.row)) return;
  const next = clone(planning);
  const moved = next.items.find(entry=>entry.id===item.id);
  Object.assign(moved,{start:target.start,end:target.end});
  if (target.lane) Object.assign(moved,{row:target.lane.row.id,lot:target.lane.lot.id});
  if (moved.kind==='review') {
    const days = finished.edge?workingDays(dayNumber(target.start),dayNumber(target.end),scale.calendar):bufferDaysFor(item);

  }

function downloadHtml(data) {

  doc.querySelector('#planning-data').textContent = JSON.stringify({...data,copyId:newId()}).replaceAll('<','\\u003c');
  const html = '<!doctype html>\n'+doc.documentElement.outerHTML;
  const url = URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const a = document.createElement('a');
  const base = data.title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  a.href = url;
  a.download = (base||t('Planning',"Schedule"))+'_Gantt.html';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  $('status').textContent = t('La copie HTML contient le planning actuel.',"The HTML copy contains the current schedule.");

}

  const next = zoomLevels[Math.max(0,Math.min(zoomLevels.length-1,index+delta-offset))];
  if (next===zoom || delta<0 && zoom<zoomLevels[0]) return;

  const svg = chart.firstElementChild;
  const bounds = chart.getBoundingClientRect();
  const viewOffset = clientX==null?chart.clientWidth/2:Math.max(0,Math.min(chart.clientWidth,clientX-bounds.left));
  const before = chartPoint(svg,bounds.left+viewOffset,bounds.top);
  const day = Math.max(0,(before.x-scale.left)/scale.step);

$('chart').addEventListener('wheel',event=>{

},{passive:false});

function validIso(value) {
  return typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && Number.isFinite(dayNumber(value)) && isoDay(dayNumber(value))===value;
}
function readPlanning(data) {
  if (!data || typeof data.title!=='string' || !data.title.trim() || !Array.isArray(data.lots) || !Array.isArray(data.items)) throw Error();
  if (displayOptions.some(([key])=>data[key]!==undefined && typeof data[key]!=='boolean')) throw Error();
  if ((data.startDate!==undefined && !validIso(data.startDate)) || (data.endDate!==undefined && !validIso(data.endDate))
    || (data.startDate && data.endDate && data.startDate>data.endDate)) throw Error();
  const ids = new Set();
  function claim(id) {
    if (typeof id!=='string' || !/^[\w-]+$/.test(id) || ids.has(id)) throw Error();
    ids.add(id);
  }
  const lots = new Map();
  for (const lot of data.lots) {
    claim(lot.id);
    if (typeof lot.name!=='string' || !/^#[0-9a-f]{6}$/i.test(lot.color) || !Array.isArray(lot.rows)) throw Error();
    const rows = new Set();
    lots.set(lot.id,rows);
    for (const row of lot.rows) {
      claim(row.id);
      if (typeof row.name!=='string') throw Error();
      rows.add(row.id);
    }
  }
  for (const item of data.items) {
    claim(item.id);
    if (![...rowTypes,'marker','off','allocation'].includes(item.kind) || !validIso(item.start) || !validIso(item.end)
      || item.start>item.end || (item.name!=null && typeof item.name!=='string') || (item.caption!=null && typeof item.caption!=='string')
      || (item.bufferDays!=null && (!Number.isSafeInteger(item.bufferDays) || item.bufferDays<0 || dayNumber(item.end)+item.bufferDays>lastSupportedDay))
      || (item.extra!=null && !Number.isFinite(item.extra))
      || (item.restriction!==undefined && (!bufferTypes.has(item.kind) || typeof item.restriction!=='string'
        || !item.restriction.trim() || item.restriction.length>80))) throw Error();
    if (rowTypes.has(item.kind) && !lots.get(item.lot)?.has(item.row)) throw Error();
    if (item.kind==='allocation' && !lots.has(item.lot)) throw Error();
  }
  normalizeReviewBuffers(data);
  resolveRestrictions(data,{items:[]});
  return data;
}
$('load-json').onchange = async event=>{
  const input = event.target;
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  try {
    const next = readPlanning(JSON.parse(await file.text()));
    $('dialog').close();
    selectedItems.clear();
    commit(next);
  } catch {
    error(t('Ce fichier ne contient pas un planning Gantt valide.',"This file does not contain a valid Gantt schedule."));
  }
};
$('export').onclick = ()=>showEditor('files');
$('help').onclick = ()=>showEditor('help');
$('start-date').onclick = ()=>showEditor('date');
$('cancel').onclick = ()=>$('dialog').close();
$('delete').onclick = remove;
$('form').onsubmit = submit;
$('chart').addEventListener('click',handleHit);
$('chart').addEventListener('dblclick',handleHit);
$('chart').addEventListener('contextmenu',event=>{
  const cell = event.target.closest('[data-hit^="cell:"]');
  if (!cell) return;
  event.preventDefault();
  const row = cell.dataset.hit.slice(5);
  const lot = scale.rows.get(row).lot.id;
  const {x} = chartPoint(cell.ownerSVGElement,event.clientX,event.clientY);
  const day = dayAtPointer(x);
  if (day===undefined) return;
  const start = isoDay(day);
  showEditor('add',{kind:'task',lot,row,start});
});
$('chart').addEventListener('pointerdown',event=>{
  const g = event.target.closest('.line-title');
  if (!g || !event.isPrimary || event.button!==0) return;
  const [type,id] = g.dataset.hit.split(':');
  const lane = scale.rows.get(id);
  const lot = lane?.lot || planning.lots.find(lot=>lot.id===id);
  const parent = type==='lot' || (lot.inline && lot.rows[0].id===id);
  rowDrag = {lot,id,parent,pointer:event.pointerId,x:event.clientX,y:event.clientY,g};
});
function rowDragTarget(event) {
  const dx = event.clientX-rowDrag.x;
  const dy = event.clientY-rowDrag.y;
  const {lot,id,parent,g} = rowDrag;
  const lotIndex = planning.lots.indexOf(lot);
  if (parent && lotIndex>0 && lot.inline && lot.rows.length===1 && dx>=24 && Math.abs(dy)<20
    && dx>Math.abs(dy)*1.25) return {indent:true,hit:g.dataset.hit};
  if (Math.abs(dy)<7 || Math.abs(dy)<Math.abs(dx)*.65) return null;
  const siblings = parent?planning.lots:lot.rows.slice(lot.inline?1:0);
  const sourceIndex = siblings.findIndex(entry=>entry.id===(parent?lot.id:id));
  const position = entry=>parent?scale.parents.get(entry.id):scale.rows.get(entry.id).y+5;
  const y = position(siblings[sourceIndex])+dy;
  let to = sourceIndex;
  const direction = Math.sign(dy);
  for (let index=sourceIndex+direction;index>=0 && index<siblings.length;index+=direction) {
    const midpoint = (position(siblings[index])+position(siblings[to]))/2;
    if (direction*(y-midpoint)<0) break;
    to = index;
  }
  if (to===sourceIndex) return null;
  const target = siblings[to];
  const hit = parent?(target.inline?'row:'+target.rows[0].id:'lot:'+target.id):'row:'+target.id;
  return {hit,from:sourceIndex,to};
}
function reorderLine(next,source,target) {
  const entries = source.parent?next.lots:next.lots.find(lot=>lot.id===source.lot.id).rows;
  const offset = !source.parent && source.lot.inline?1:0;
  const [entry] = entries.splice(target.from+offset,1);
  entries.splice(target.to+offset,0,entry);
  return next;
}
function clearRowDrag(event,save) {
  if (!rowDrag || (event.type!=='keydown' && rowDrag.pointer!==event.pointerId)) return;
  const target = save?rowDragTarget(event):null;
  const previous = rowDrag;
  rowDrag = undefined;
  previous.highlight?.classList.remove('drop-target');
  previous.g.querySelector('.target').classList.remove('indent-target');
  if (!target) return;
  suppressClick = true;
  if (target.indent) indentLine(previous.lot.id);
  else commit(reorderLine(clone(planning),previous,target));
}
window.addEventListener('pointermove',event=>{
  if (rowDrag?.pointer!==event.pointerId) return;
  const target = rowDragTarget(event);
  rowDrag.highlight?.classList.remove('drop-target');
  rowDrag.g.querySelector('.target').classList.toggle('indent-target',Boolean(target?.indent));
  rowDrag.highlight = target && !target.indent?$('chart').querySelector('[data-hit="'+target.hit+'"]'):null;
  rowDrag.highlight?.classList.add('drop-target');
});
window.addEventListener('pointerup',event=>clearRowDrag(event,true));
window.addEventListener('pointercancel',event=>clearRowDrag(event,false));
$('chart').addEventListener('keydown',handleHit);
$('chart').addEventListener('pointerdown',startDrag);
$('chart').addEventListener('pointerdown',event=>{
  if (drag || rowDrag || !event.isPrimary || event.button!==0) return;
  const hit = event.target.closest('[data-hit]')?.dataset.hit.split(':')[0];
  const svg = $('chart').firstElementChild;
  if (hit && hit!=='cell' || !svg?.contains(event.target)) return;
  const origin = chartPoint(svg,event.clientX,event.clientY);
  if (origin.x<scale.left || origin.y<80) return;
  marquee = {origin,svg,pointer:event.pointerId,x:event.clientX,y:event.clientY,previous:new Set(selectedItems)};
});
function selectRectangle(first,last) {
  const left = Math.min(first.x,last.x), right = Math.max(first.x,last.x);
  const top = Math.min(first.y,last.y), bottom = Math.max(first.y,last.y);
  const ids = [...scale.selectable].filter(([,box])=>
    box.x<=right && box.x+box.width>=left && box.y<=bottom && box.y+box.height>=top
  ).map(([id])=>id);
  return {left,top,width:right-left,height:bottom-top,ids};
}
window.addEventListener('pointermove',event=>{
  if (marquee?.pointer!==event.pointerId) return;
  if (!marquee.box) {
    if (Math.hypot(event.clientX-marquee.x,event.clientY-marquee.y)<5) return;
    marquee.box = rect(0,0,0,0,'transparent',{class:'selection-box'});
    marquee.svg.append(marquee.box);
    $('chart').setPointerCapture(event.pointerId);
  }
  updateMarquee(event);
});
function updateMarquee(event) {
  const area = selectRectangle(marquee.origin,chartPoint(marquee.svg,event.clientX,event.clientY));
  for (const [name,value] of Object.entries({x:area.left,y:area.top,width:area.width,height:area.height})) {
    marquee.box.setAttribute(name,value);
  }
  selectedItems.clear();
  for (const id of area.ids) selectedItems.add(id);
  paintSelection();
}
function finishMarquee(event,save) {
  if (!marquee || (event.type!=='keydown' && marquee.pointer!==event.pointerId)) return;
  if (marquee.box && save) updateMarquee(event);
  const {box,pointer,previous} = marquee;
  marquee = undefined;
  if (!box) return;
  suppressClick = true;
  box.remove();
  if (!save) {
    selectedItems.clear();
    for (const id of previous) selectedItems.add(id);
    paintSelection();
  }
  const chart = $('chart');
  if (chart.hasPointerCapture(pointer)) chart.releasePointerCapture(pointer);
  chart.focus({preventScroll:true});
}
window.addEventListener('pointerup',event=>finishMarquee(event,true));
window.addEventListener('pointercancel',event=>finishMarquee(event,false));
window.addEventListener('pointermove',moveDrag);
window.addEventListener('pointerup',event=>finishDrag(event,true));
window.addEventListener('pointercancel',event=>finishDrag(event,false));
$('chart').addEventListener('lostpointercapture',event=>{
  if (event.target===$('chart')) {
    finishDrag(event,false);
    finishMarquee(event,false);
  }
});
window.addEventListener('keydown',event=>{
  if (event.key==='Escape' && drag?.preview) finishDrag(event,false);
  if (event.key==='Escape') {
    clearRowDrag(event,false);
    finishMarquee(event,false);
  }
  if (event.defaultPrevented || $('dialog').open || drag || rowDrag || marquee
    || event.target.closest?.('input,textarea,select,[contenteditable=true]')) return;
  if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase()==='z') {
    event.preventDefault();
    if (event.shiftKey) restore(redoHistory,history);
    else restore(history,redoHistory);
  }
  if (event.key==='Backspace' && selectedItems.size) {
    if (!planning.items.some(item=>selectedItems.has(item.id))) return;
    event.preventDefault();
    const next = clone(planning);
    next.items = next.items.filter(item=>!selectedItems.has(item.id));
    selectedItems.clear();
    commit(next);
  }
});
render(!planning.lots.length && !planning.items.length);
</script>
